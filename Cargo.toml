[package]
name = "gem"
edition = "2024"
license = "MIT"

description = "Color representations and conversions"
repository = "https://github.com/crates-lurey-io/gem"
version = "0.1.0-alpha.7"
rust-version = "1.88"

[lints.rust]
unsafe_code = "deny"  # bytemuck Pod/Zeroable impls on generic types require unsafe impl
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "allow"

[workspace]
members = ["tools/cargo-bin"]

[workspace.metadata.bin]
cargo-nextest = { version = "0.9.98", locked = true }
cargo-llvm-cov = { version = "0.6.16", locked = true }
cargo-hack = { version = "0.6.45", locked = true }
cargo-semver-checks = { version = "0.48.0", locked = true }
just = { version = "1.40.0" }

[features]
# No math backend is enabled by default: the pixel-format layer (`rgb`,
# `gray`, `alpha`) needs none, and the `space` module requires an explicit
# opt-in to either `std` or `libm` (see the compile-time error in
# `src/space/math.rs` if you forget). This keeps `cargo add gem` from pulling
# in `libm` for consumers who only want zero-cost pixel formats.
default = []
std = []
blend = []
libm = ["dep:libm"]
libm-arch = ["libm/arch"]
bytemuck = ["dep:bytemuck"]
serde = ["dep:serde"]

[dependencies]
bytemuck = { version = "1.23.1", optional = true, default-features = false, features = [
  "derive",
] }
libm = { version = "0.2", default-features = false, optional = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
open = "5.3.2"
png = "0.17.16"
serde_json = "1.0"

[[example]]
name = "draw-png"
required-features = ["bytemuck", "std"]
