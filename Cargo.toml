[package]
name = "gem"
edition = "2024"
license = "MIT OR Apache-2.0"

description = "Color representations and conversions"
repository = "https://github.com/crates-lurey-io/gem"
version = "0.1.0"
rust-version = "1.87"

[lints.rust]
unsafe_code = "deny"  # bytemuck Pod/Zeroable impls on generic types require unsafe impl
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "allow"

[workspace]
members = ["tools/cargo-bin"]

[workspace.metadata.bin]
cargo-nextest = { version = "0.9.98", locked = true }
cargo-llvm-cov = { version = "0.6.16", locked = true }
cargo-hack = { version = "0.6.45", locked = true }
cargo-semver-checks = { version = "0.48.0", locked = true }
just = { version = "1.40.0" }

[features]
# `libm` is enabled by default so a bare `cargo add gem` / `cargo publish` verification build
# actually compiles: the pixel-format layer (`rgb`, `gray`, `alpha`) needs no math backend, but
# the always-compiled `space` module does (see the compile-time error in `src/space/math.rs`),
# and `default = []` previously left that requirement unsatisfied by default. Consumers who only
# want zero-cost pixel formats and want to avoid `libm` can `default-features = false`; std
# consumers should additionally set `features = ["std"]`, which `space` prefers over `libm` when
# both are present.
default = ["libm"]
std = []
blend = []
libm = ["dep:libm"]
libm-arch = ["libm/arch"]
bytemuck = ["dep:bytemuck"]
serde = ["dep:serde"]

[dependencies]
bytemuck = { version = "1.23.1", optional = true, default-features = false, features = [
  "derive",
] }
libm = { version = "0.2", default-features = false, optional = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
open = "5.3.2"
png = "0.17.16"
serde_json = "1.0"

[[example]]
name = "draw-png"
required-features = ["bytemuck", "std"]
