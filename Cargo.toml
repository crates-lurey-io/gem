[package]
name = "gem"
edition = "2024"
license = "MIT OR Apache-2.0"

description = "Color representations and conversions"
repository = "https://github.com/crates-lurey-io/gem"
version = "0.2.2"
rust-version = "1.87"

[lints.rust]
unsafe_code = "deny"  # bytemuck Pod/Zeroable impls on generic types require unsafe impl
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "allow"

# `default = []` is the pixel-format layer alone, so without this docs.rs would publish docs with
# no `space`, `named`, or `blend` at all. `--cfg docsrs` turns on the `doc_cfg` attributes that
# label which feature each gated item needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["tools/cargo-bin"]

[workspace.metadata.bin]
cargo-nextest = { version = "0.9.98", locked = true }
cargo-llvm-cov = { version = "0.6.16", locked = true }
cargo-hack = { version = "0.6.45", locked = true }
cargo-semver-checks = { version = "0.48.0", locked = true }
just = { version = "1.40.0" }

[features]
# Nothing is on by default: the pixel-format layer (`rgb`, `gray`, `alpha`, `channel`) needs no
# math backend at all, and that layer alone is what `default-features = false` should get you.
#
# 0.1.x had `default = ["libm"]` as a workaround: `space` was compiled unconditionally and hit a
# `compile_error!` without a math backend, which broke `cargo publish`'s verification build. The
# module is now `#[cfg]`-gated instead, so the workaround is gone and the default set is honest.
default = []

# Compiles `space`, `named`, and the `From<Srgb>` conversions on every pixel format. Turned on
# automatically by `std`, `libm`, and `blend`; you should not need to name it directly, and
# enabling it without a math backend is a compile error (see `src/space/math.rs`).
space = []

std = ["space"]
libm = ["space", "dep:libm"]
libm-arch = ["libm/arch"]
blend = ["space"]
bytemuck = ["dep:bytemuck"]
serde = ["dep:serde"]

[dependencies]
bytemuck = { version = "1.23.1", optional = true, default-features = false, features = [
  "derive",
] }
libm = { version = "0.2", default-features = false, optional = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
open = "5.3.2"
png = "0.17.16"
serde_json = "1.0"

[[example]]
name = "draw-png"
required-features = ["bytemuck", "std"]
